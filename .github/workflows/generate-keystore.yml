name: One-Off Release Keystore Generator

# Run this workflow ONCE to create a secure production release keystore on GitHub Actions.
# The keystore and credentials will be uploaded as an artifact for secure backup and secrets setup.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Keystore Key Alias'
        required: true
        default: 'release-key'
      validity_years:
        description: 'Validity in years (min 25)'
        required: true
        default: '30'
      store_password:
        description: 'Store Password (optional, autogenerated if blank)'
        required: false
        default: ''
      key_password:
        description: 'Key Password (optional, autogenerated if blank)'
        required: false
        default: ''

jobs:
  generate:
    name: Generate Production Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore & Cryptographic Credentials
        id: gen
        run: |
          ALIAS="${{ github.event.inputs.key_alias }}"
          DAYS=$(( ${{ github.event.inputs.validity_years }} * 365 ))

          STORE_PASS="${{ github.event.inputs.store_password }}"
          if [ -z "$STORE_PASS" ]; then
            STORE_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 20)
          fi

          KEY_PASS="${{ github.event.inputs.key_password }}"
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 20)
          fi

          echo "Generating 2048-bit RSA keystore (validity: $DAYS days)..."
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$DAYS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=VoiceActors, OU=Mobile, O=ATMR, L=London, ST=GreaterLondon, C=GB"

          CERT_SHA256=$(keytool -list -v -keystore release.keystore -storepass "$STORE_PASS" | grep "SHA256:" | awk '{print $2}' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          KEYSTORE_BASE64=$(base64 -w 0 release.keystore)

          mkdir -p bundle
          cp release.keystore bundle/
          cat <<EOF > bundle/credentials.env
          ANDROID_KEY_ALIAS=$ALIAS
          ANDROID_KEYSTORE_PASSWORD=$STORE_PASS
          ANDROID_KEY_PASSWORD=$KEY_PASS
          ANDROID_CERT_SHA256=$CERT_SHA256
          ANDROID_KEYSTORE_BASE64=$KEYSTORE_BASE64
          EOF

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$KEYSTORE_BASE64"

          echo "### 🔑 Keystore Generated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Certificate SHA-256 Fingerprint: \`$CERT_SHA256\`" >> $GITHUB_STEP_SUMMARY
          echo "Alias: \`$ALIAS\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Keystore Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-bundle
          path: bundle/
          retention-days: 1
