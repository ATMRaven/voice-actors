<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Voice Actors — Offline</title>
  <style>
    :root {
      --bg: #F3F1EC; --surface: #FCFBF8; --text: #151517; --sub: #56534B;
      --border: rgba(21,21,23,0.1); --cta-bg: #151517; --cta-fg: #FCFBF8; --accent: #D44824;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131416; --surface: #1B1C1F; --text: #F4F1EA; --sub: #ABA69D;
        --border: rgba(244,241,234,0.1); --cta-bg: #F4F1EA; --cta-fg: #131416; --accent: #EE6C45;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 28px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 400px; width: 100%; text-align: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px;
    }
    .mark {
      width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 14px;
      display: grid; place-items: center; background: var(--cta-bg); color: var(--cta-fg);
    }
    h1 { font-size: 1.3rem; margin: 0 0 8px; font-weight: 600; }
    p { margin: 0 0 22px; color: var(--sub); font-size: 0.9rem; line-height: 1.55; }
    button {
      width: 100%; height: 48px; border: 0; border-radius: 12px;
      background: var(--cta-bg); color: var(--cta-fg); font-size: 0.94rem; font-weight: 600; cursor: pointer;
    }
    button:active { transform: scale(0.985); }
    .hint { margin-top: 14px; font-size: 0.78rem; color: var(--sub); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 11v2M7.5 7v10M12 4v16M16.5 8v8M21 11v2" />
      </svg>
    </div>
    <h1>Can’t reach the studio</h1>
    <p>Voice Actors loads its synthesis engine from the network. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
    <div class="hint">Saved offline audio clips return once the studio connects.</div>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      location.replace('https://voxflow-809.pages.dev/');
    });
  </script>
</body>
</html>
